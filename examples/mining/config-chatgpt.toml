[model]
provider = "openai_responses"
model = "gpt-6.1-sol"
auth_mode = "chatgpt"
api_key_env = "OPENAI_API_KEY"
base_url = "https://api.openai.com/v1"
reasoning_effort = "medium"
context_window = 256000
max_output_tokens = 8192


[runtime]
approval_mode = "never"
max_model_steps = 80
max_tool_calls = 240
max_parallel_reads = 4
deadline_seconds = 2400
allow_write = false
allow_commands = false

[skills]
roots = ["./skills"]
[mcp.servers.mining-news]
transport = "streamable_http"
url = "https://mining-mcp.charworkservice.site/mcp/news/"
required = true
timeout_seconds = 90
token_env = "MINING_SERVICE_TOKEN"

[mcp.servers.mining-documents]
transport = "streamable_http"
url = "https://mining-mcp.charworkservice.site/mcp/documents/"
required = true
timeout_seconds = 90
token_env = "MINING_SERVICE_TOKEN"

[mcp.servers.mining-market]
transport = "streamable_http"
url = "https://mining-mcp.charworkservice.site/mcp/market/"
required = true
timeout_seconds = 90
token_env = "MINING_SERVICE_TOKEN"